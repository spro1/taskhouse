# Push a tag like v0.2.0 (matching "version" in package.json) to publish:
#   - ghcr.io/<owner>/taskhouse:<version> and :latest, ghcr.io/<owner>/taskhouse-postgres:17 (linux/amd64 + linux/arm64)
#   - a GitHub Release with an offline bundle per architecture (deploy files + images, see scripts/bundle.sh)
# If a run fails for a reason outside the code, run this workflow by hand (Actions → Release → Run workflow) with the
# same tag: it rebuilds from that tag without creating a new version.
name: Release

on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  TAG: ${{ inputs.tag || github.ref_name }}
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image: ${{ steps.v.outputs.image }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Version in package.json matches the tag
        run: test "$(node -p "require('./package.json').version")" = "${{ needs.meta.outputs.version }}"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          # Pre-releases (v1.2.0-beta.1) never move :latest.
          tags: |
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.prerelease != 'true' && format('{0}:latest', needs.meta.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: PostgreSQL image (patched, without gosu)
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.meta.outputs.image }}-postgres:17

  bundles:
    needs: [meta, image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The bundle's compose file uses the local image names, so tag the published images that way.
      - name: Save ${{ matrix.arch }} images
        run: |
          img=${{ needs.meta.outputs.image }}
          docker pull --platform linux/${{ matrix.arch }} "$img:${{ needs.meta.outputs.version }}"
          docker pull --platform linux/${{ matrix.arch }} "$img-postgres:17"
          docker tag "$img:${{ needs.meta.outputs.version }}" localhost/taskhouse:latest
          docker tag "$img-postgres:17" localhost/taskhouse-postgres:17
          docker save -o images.tar localhost/taskhouse:latest localhost/taskhouse-postgres:17
      - name: Build bundle
        run: |
          sh scripts/bundle.sh images.tar
          v=${{ needs.meta.outputs.version }}
          mkdir release && mv "taskhouse-$v.tar.gz" "release/taskhouse-$v-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.arch }}
          path: release/*.tar.gz

  publish:
    needs: [meta, bundles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: bundles-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            release/taskhouse-*.tar.gz
            release/SHA256SUMS
