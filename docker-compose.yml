# Taskhouse: app + PostgreSQL + automatic backups. Works with `docker compose` and `podman compose`.
services:
  db:
    build: docker/postgres
    image: ${TASKHOUSE_POSTGRES_IMAGE:-localhost/taskhouse-postgres}:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskhouse
      POSTGRES_DB: taskhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhouse -d taskhouse"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s

  app:
    build: .
    image: ${TASKHOUSE_IMAGE:-localhost/taskhouse}:${TASKHOUSE_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Every setting in .env reaches the app (SECRET_KEY, OIDC_*, SMTP_URL, TRUST_PROXY …).
    env_file: .env
    environment:
      DATABASE_URL: postgres://taskhouse:${POSTGRES_PASSWORD}@db:5432/taskhouse
      DATA_DIR: /data
      PORT: 3000 # inside the container; .env's PORT is the host side
      BACKUP_DIR: /backups # read-only, for Admin → Monitoring (last backup, overdue warning)
    volumes:
      - files:/data
      - ./backups:/backups:ro
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    stop_grace_period: 15s

  # Backups into ./backups: one at start, then every BACKUP_INTERVAL_HOURS (see docker/backup.sh).
  # Also runs manual backups and restores for scripts/backup.sh and scripts/restore.sh.
  backup:
    image: ${TASKHOUSE_POSTGRES_IMAGE:-localhost/taskhouse-postgres}:17
    # root only to write into ./backups (owned by the host user) and to restore the files volume
    user: root
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: taskhouse
      PGDATABASE: taskhouse
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INTERVAL: ${BACKUP_INTERVAL_HOURS:-24}
      KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - files:/data
      - ./backups:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    command: ["loop"]

volumes:
  db:
  files:
